// ============================================================================
//  Endurance（永恒号）适配补丁 —— 让这个模组贴合我们当前的模组列表
//  作者：Codex　2026-10-10
//
//  只做两件事，全部用 ModuleManager 补丁实现，不改模组原文件：
//    1) 聚变反应堆：发热量归零（不再依赖散热器、不再过热停机）
//       注意：EC 输出保持原值不动 —— 每台 3000 EC/s，6 台共 18,000 EC/s
//    2) 维生：清掉已废弃的 USI 模块名，改用现版 USI-LS（112.x）的 USILS_* 体系，
//       并给医疗舱补上低温休眠（对应它"能让乘员睡眠与唤醒 6 次"的设定）
//
//  依赖：CommunityResourcePack(已有) / USI-LS(已装) / 可选 DeepFreeze
//  卸载：直接删掉 GameData\Endurance_适配 整个目录即可
// ============================================================================


// ============================================================================
//  一、聚变反应堆：发热量归零
//     受影响的零件：DSPS x300 燃料组件、漫游者号、登陆舱、蝰蛇（它们共用同一套托卡马克）
//     —— 只关掉发热与过热逻辑，发电量（3000 EC/s）与燃料消耗（FusionPellets 0.003/s）原样保留
// ============================================================================

@PART[ENmountEndurance|ENrangerBody|ENlanderBody|ENminiRanger]:FINAL
{
	// 关掉发热标记
	@MODULE[ModuleResourceConverter]:HAS[#ConverterName[Tokamak Reactor]]
	{
		@GeneratesHeat = False
	}

	// 移除核心温度与过热显示（否则没有散热器时会一路升到 2000 K 自动停机）
	!MODULE[ModuleCoreHeat] {}
	!MODULE[ModuleOverheatDisplay] {}
}


// ============================================================================
//  二、维生：清理废弃模块
//     模组自带的 LS_USI.cfg 引用的是 ModuleLifeSupport / ModuleLifeSupportRecycler
//     / ModuleHabitation —— 这三个类在现版 USI-LS 里已经不存在了（日志里那几条
//     "Cannot find a PartModule of typename ..." 就是它们），先把它们清掉
// ============================================================================

@PART[ENhabEndurance|ENinfirmaryEndurance|ENdeployableHabitat|ENdeployableLab|ENcargoEndurance]:FINAL
{
	!MODULE[ModuleLifeSupport] {}
	!MODULE[ModuleLifeSupportRecycler] {}
	!MODULE[ModuleHabitation] {}
}


// ============================================================================
//  三、维生：给缺"USI 可切换舱段"的舱段补上基础模块
//     （医疗舱 ENinfirmaryEndurance 原来那套是好的，用 :HAS 跳过它，避免重复模块）
// ============================================================================

@PART[ENhabEndurance|ENdeployableHabitat|ENdeployableLab]:HAS[!MODULE[USI_SwappableBay]]:FINAL
{
	MODULE
	{
		name = USI_SwapController
	}
	MODULE
	{
		name = USI_SwappableBay
		bayName = Bay 1
		moduleIndex = 0
	}
	MODULE
	{
		name = USI_Converter
		UseSpecialistBonus = false
	}
}


// ============================================================================
//  四、维生：居住舱能力（延长乘员在轨时间）
//     参数参照原作者的意图（KerbalMonths = 质量 × 5）与 USI-LS 自己的数值
// ============================================================================

// EC-200 乘员舱：4 人，4 t → 20 Kerbal-Months
@PART[ENhabEndurance]:HAS[!MODULE[USILS_HabitationSwapOption]]:FINAL
{
	MODULE
	{
		name = USILS_HabitationSwapOption
		ConverterName = Habitat
		StartActionName = Start Habitat
		StopActionName = Stop Habitat

		BaseKerbalMonths = 20
		CrewCapacity = 4
		BaseHabMultiplier = 1

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 0.525
		}
	}
}

// MB-75 可展开居住舱：展开后 10 人，殖民地级 → 60 Kerbal-Months
@PART[ENdeployableHabitat]:HAS[!MODULE[USILS_HabitationSwapOption]]:FINAL
{
	MODULE
	{
		name = USILS_HabitationSwapOption
		ConverterName = Habitat
		StartActionName = Start Habitat
		StopActionName = Stop Habitat

		BaseKerbalMonths = 60
		CrewCapacity = 10
		BaseHabMultiplier = 1.25

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 0.525
		}
	}
}


// ============================================================================
//  五、维生：生保回收（Recycler）—— 都能在游戏里手动切换开/关
//     回收率沿用原作者在 LS_USI.cfg 里写的数值
// ============================================================================

@PART[ENhabEndurance]:HAS[!MODULE[USILS_LifeSupportRecyclerSwapOption]]:FINAL
{
	MODULE
	{
		name = USILS_LifeSupportRecyclerSwapOption
		ConverterName = Life Support
		StartActionName = Start Life Support
		StopActionName = Stop Life Support

		CrewCapacity = 4
		RecyclePercent = 0.7

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1
		}
	}
}

@PART[ENdeployableHabitat]:HAS[!MODULE[USILS_LifeSupportRecyclerSwapOption]]:FINAL
{
	MODULE
	{
		name = USILS_LifeSupportRecyclerSwapOption
		ConverterName = Life Support
		StartActionName = Start Life Support
		StopActionName = Stop Life Support

		CrewCapacity = 10
		RecyclePercent = 0.8

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1
		}
	}
}

@PART[ENinfirmaryEndurance]:HAS[!MODULE[USILS_LifeSupportRecyclerSwapOption]]:FINAL
{
	MODULE
	{
		name = USILS_LifeSupportRecyclerSwapOption
		ConverterName = Life Support
		StartActionName = Start Life Support
		StopActionName = Stop Life Support

		CrewCapacity = 4
		RecyclePercent = 0.7

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1
		}
	}
}

// MB-50 机动分析舱：3 人，按 USI-LS 里"大型载人实验室"的同级数值
@PART[ENdeployableLab]:HAS[!MODULE[USILS_LifeSupportRecyclerSwapOption]]:FINAL
{
	MODULE
	{
		name = USILS_LifeSupportRecyclerSwapOption
		ConverterName = Life Support
		StartActionName = Start Life Support
		StopActionName = Stop Life Support

		CrewCapacity = 3
		RecyclePercent = 0.5

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1
		}
	}
}


// ============================================================================
//  六、维生：医疗舱的低温休眠
//     原设定："可让最多 4 名乘员睡眠与唤醒 6 次"
//     用现版 USI-LS 自带的低温舱模块实现（燃料是 Glykerol，和 DeepFreeze 同一套资源）
// ============================================================================

@PART[ENinfirmaryEndurance]:HAS[!MODULE[ModuleCryoFreezer]]:FINAL
{
	MODULE
	{
		name = ModuleCryoResource
		ResourceName = Glykerol
		ResourceQty = 500
	}
	MODULE
	{
		name = ModuleCryoFreezer
		UnfreezeMinLifespan = 18407040
		UnfreezeMaxLifespan = 92035200
		UnfreezeMaxFailPercent = 0.5
		CanRecharge = true
		FreezeRequiresScientist = true
		UnfreezeRequiresScientist = true
	}
	RESOURCE
	{
		name = Glykerol
		amount = 500
		maxAmount = 500
	}
}


// ============================================================================
//  七、后勤舱：补给仓储加大（永恒号本来就是一艘"补给母船"）
//     注意：这里是在模组/LS_USI.cfg 已有的 Supplies 节点上改数值，不是新增重复节点
// ============================================================================

@PART[ENcargoEndurance]:FINAL
{
	@RESOURCE[Supplies]
	{
		@amount = 800
		@maxAmount = 800
	}
}
